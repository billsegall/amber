<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amber — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="icon" href="/static/favicon.ico">
  <style>
    body { background: #1a1a2e; color: #e0e0e0; }
    .card { background: #16213e; border: 1px solid #0f3460; }
    .form-control { background: #0f3460; border-color: #1e5a8a; color: #e0e0e0; }
    .form-control:focus { background: #0f3460; border-color: #69f0ae; color: #e0e0e0; box-shadow: none; }
  </style>
</head>
<body>
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card p-4" style="width:100%;max-width:360px">
    <h4 class="mb-4 text-center fw-bold">⚡ Amber Monitor</h4>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ 'danger' if cat == 'error' else cat }} py-2 small">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label text-secondary small">Username</label>
        <input type="text" name="username" class="form-control" autofocus autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label text-secondary small">Password</label>
        <input type="password" name="password" class="form-control" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-info w-100">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
